name: repopilot-ch09-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repopilot
      POSTGRES_PASSWORD: repopilot
      POSTGRES_DB: repopilot_ch09_test
    ports:
      - "127.0.0.1:${CH09_POSTGRES_PORT:-55439}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repopilot -d repopilot_ch09_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migration-test:
    build: .
    command:
      - sh
      - -c
      - pip install -q '.[dev]' && python -m pytest -q -s tests/test_migrations_postgres.py
    environment:
      REPOPILOT_POSTGRES_TEST_URL: postgresql+asyncpg://repopilot:repopilot@postgres:5432/repopilot_ch09_test
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./tests:/app/tests:ro

volumes:
  postgres-data:
