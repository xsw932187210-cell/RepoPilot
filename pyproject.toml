[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "repopilot"
version = "0.1.0"
description = "A recoverable, human-governed multi-agent software delivery system built with LangGraph."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "xsw932187210" }]
dependencies = [
  "alembic>=1.17,<2",
  "aiosqlite>=0.21,<1",
  "asyncpg>=0.30,<1",
  "docker>=7.1,<8",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "google-genai>=2.32,<3",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-postgres>=3.0,<4",
  "langsmith>=0.14,<1",
  "orjson>=3.10,<4",
  "openai>=3.35,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "redis>=6.2,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
oauth = ["PyJWT[crypto]>=2.10,<3"]
dev = [
  "PyJWT[crypto]>=2.10,<3",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[project.scripts]
repopilot-worker = "repopilot.worker:main"
repopilot-eval = "repopilot.evaluation:main"
repopilot-migrate = "repopilot.migrations.cli:main"
repopilot-publish = "repopilot.publication_cli:main"
repopilot-chatgpt = "repopilot.chatgpt_auth:main"
repopilot-doctor = "repopilot.doctor:main"
repopilot-demo = "repopilot.demo:main"

[dependency-groups]
build = ["hatchling==1.27.0", "editables==0.5"]
sandbox = ["pytest==8.4.2", "ruff==0.17.1"]

[tool.uv]
required-version = "==0.9.6"

[tool.hatch.build.targets.wheel]
packages = ["src/repopilot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["evals/real/overlays"] # Pinned upstream fixtures; hashes must stay byte-exact.

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]
