name: isolated-service-verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'requirements/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'
      - 'delivery/**'
      - 'scripts/ch18_integration.sh'
      - 'scripts/ch06a_integration.sh'
      - 'scripts/verification_summary.py'
      - 'scripts/*smoke.sh'
      - 'src/repopilot/sandbox.py'
      - 'src/repopilot/migrations/**'
      - 'tests/conftest.py'
      - '.github/workflows/integration.yml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Compatibility probes read two pinned historical source trees.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Full Mock/PostgreSQL/Redis/Docker matrix and Worker restart
        run: make verify
      - name: Upload allowlisted aggregate evidence only
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: isolated-service-evidence-${{ github.run_id }}
          path: reports/repopilot_ch18_*/delivery-summary.json
          if-no-files-found: error
