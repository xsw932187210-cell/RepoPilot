name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/uv.txt
      - run: pip install --require-hashes -r requirements/uv.txt
      - name: Install locked dependencies and build backend
        run: uv sync --locked --extra dev --group build --no-install-project
      - run: uv sync --locked --extra dev --group build --no-build-isolation
      - run: uv run --no-sync ruff check .
      - name: Check local readiness without model calls
        run: uv run --no-sync repopilot-doctor
      - name: Run tests with coverage floor
        run: uv run --no-sync pytest --cov=repopilot --cov-report=term-missing --cov-fail-under=70 -q
      - name: Run deterministic workflow benchmark
        run: >-
          uv run --no-sync python -m repopilot.evaluation
          --provider mock
          --output reports/mock-evaluation.json
          --fail-on-regression
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mock-evaluation-${{ github.run_id }}
          path: reports/mock-evaluation.json
          if-no-files-found: error
