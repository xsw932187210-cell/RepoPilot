name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[dev]"
      - run: ruff check .
      - name: Run tests with coverage floor
        run: pytest --cov=repopilot --cov-report=term-missing --cov-fail-under=70 -q
      - name: Run deterministic workflow benchmark
        run: >-
          python -m repopilot.evaluation
          --provider mock
          --output reports/mock-evaluation.json
          --fail-on-regression
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mock-evaluation-${{ github.run_id }}
          path: reports/mock-evaluation.json
          if-no-files-found: error
